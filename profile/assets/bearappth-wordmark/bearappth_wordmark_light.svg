<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bearGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Bear: left ear (outer) -->
  <circle cx="26" cy="26" r="18" fill="url(#bearGrad2)"/>
  <!-- Bear: right ear (outer) -->
  <circle cx="74" cy="26" r="18" fill="url(#bearGrad2)"/>
  <!-- Bear: inner ears -->
  <circle cx="26" cy="26" r="10" fill="rgba(255,255,255,0.30)"/>
  <circle cx="74" cy="26" r="10" fill="rgba(255,255,255,0.30)"/>

  <!-- Bear: face -->
  <rect x="8" y="22" width="84" height="82" rx="22" fill="url(#bearGrad)"/>

  <!-- Bear: eyes (white) -->
  <circle cx="32" cy="52" r="9" fill="white"/>
  <circle cx="68" cy="52" r="9" fill="white"/>
  <!-- Bear: pupils -->
  <circle cx="33" cy="53" r="4.5" fill="#431407"/>
  <circle cx="69" cy="53" r="4.5" fill="#431407"/>
  <!-- Bear: eye shine -->
  <circle cx="35" cy="51" r="2" fill="white"/>
  <circle cx="71" cy="51" r="2" fill="white"/>

  <!-- Bear: muzzle area -->
  <ellipse cx="50" cy="74" rx="16" ry="12" fill="rgba(255,255,255,0.30)"/>
  <!-- Bear: nose -->
  <ellipse cx="50" cy="70" rx="7" ry="5" fill="rgba(120,40,0,0.45)"/>
  <!-- Bear: smile -->
  <path d="M40,79 Q50,89 60,79" stroke="rgba(120,40,0,0.45)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Text: BearApp (dark) + TH (orange) -->
  <text
    x="112" y="80"
    font-size="52"
    font-weight="800"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif"
    letter-spacing="-1">
    <tspan fill="#1C1917">BearApp</tspan><tspan fill="#F97316">TH</tspan>
  </text>
</svg>
